name: Deploy site

# Deploys the website to GitHub Pages. Runs when code is pushed, and every time
# Home Assistant sends fresh weather station readings (repository_dispatch).
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [station-update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build station.json from Home Assistant readings
        if: github.event_name == 'repository_dispatch'
        env:
          DATA: ${{ github.event.client_payload.data }}
        run: node scripts/build-station.mjs

      # history.json lives on the deployed site. Pull the live copy so each deployment extends it;
      # the copy committed to the repo is only the starting point (used while the site has none).
      - name: Carry over history from the live site
        run: |
          code=$(curl -s -o live-history.json -w "%{http_code}" "https://leeb9972.github.io/fintry-weather/history.json?t=$(date +%s)")
          if [ "$code" = "200" ] && node -e 'const h=JSON.parse(require("fs").readFileSync("live-history.json"));if(!Array.isArray(h.rows)||h.rows.length<1)process.exit(1)'; then
            cp live-history.json history.json
            echo "Using live history"
          elif [ "$code" = "404" ]; then
            echo "No live history yet, using the committed copy"
          else
            echo "Could not fetch live history (HTTP $code). Stopping so history is not lost."
            exit 1
          fi

      - name: Add the latest reading to history
        if: github.event_name == 'repository_dispatch'
        run: node scripts/update-history.mjs station.json history.json

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html snow.html storms.html history.html style.css common.js app.js snow.js storms.js history.js sw.js manifest.webmanifest station.json history.json _site/
          cp -r icons _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
